<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="980" viewBox="0 0 1820 980"><rect width="1820" height="980" fill="#f4efe6"/><rect x="20" y="20" width="1280" height="940" rx="18" fill="#ece4d4" stroke="#cbbfa6"/><text x="40" y="56" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#1d1d1d" text-anchor="start">BINNENHOF  ·  Tweede Kamer sitting, December 1899</text><rect x="80" y="90" width="720" height="620" rx="16" fill="#d9cbb3" stroke="#b7a48a"/><text x="440" y="124" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="700" fill="#3a3328" text-anchor="middle">Tweede Kamer (on record)</text><ellipse cx="440" cy="430" rx="280" ry="200" fill="#c9b79a" stroke="#8c7358" stroke-width="2"/><circle cx="300" cy="480" r="16" fill="#e8e0d2" stroke="#2F5D8A" stroke-width="4"/><text x="300" y="485" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11" font-weight="600" fill="#2F5D8A" text-anchor="middle">MP</text><circle cx="250" cy="430" r="16" fill="#e8e0d2" stroke="#2F5D8A" stroke-width="4"/><text x="250" y="435" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11" font-weight="600" fill="#2F5D8A" text-anchor="middle">MP</text><circle cx="300" cy="380" r="16" fill="#e8e0d2" stroke="#2F5D8A" stroke-width="4"/><text x="300" y="385" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11" font-weight="600" fill="#2F5D8A" text-anchor="middle">MP</text><circle cx="580" cy="480" r="16" fill="#e8e0d2" stroke="#2F5D8A" stroke-width="4"/><text x="580" y="485" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11" font-weight="600" fill="#2F5D8A" text-anchor="middle">MP</text><circle cx="630" cy="430" r="16" fill="#e8e0d2" stroke="#2F5D8A" stroke-width="4"/><text x="630" y="435" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11" font-weight="600" fill="#2F5D8A" text-anchor="middle">MP</text><circle cx="580" cy="380" r="16" fill="#e8e0d2" stroke="#2F5D8A" stroke-width="4"/><text x="580" y="385" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11" font-weight="600" fill="#2F5D8A" text-anchor="middle">MP</text><circle cx="440" cy="520" r="16" fill="#e8e0d2" stroke="#2F5D8A" stroke-width="4"/><text x="440" y="525" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11" font-weight="600" fill="#2F5D8A" text-anchor="middle">MP</text><rect x="390" y="300" width="100" height="36" rx="6" fill="#e8e0d2" stroke="#8B3A3A" stroke-width="3"/><text x="440" y="323" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="600" fill="#8B3A3A" text-anchor="middle">ministers</text><rect x="400" y="210" width="80" height="50" rx="6" fill="#14324a"/><text x="440" y="240" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Voorzitter</text><rect x="250" y="240" width="110" height="40" rx="6" fill="#fff" stroke="#6B6B6B"/><text x="305" y="265" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11" font-weight="600" fill="#6B6B6B" text-anchor="middle">stenographers</text><rect x="470" y="430" width="210" height="54" rx="8" fill="#fff" stroke="#2F5D8A"/><text x="480" y="452" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#2F5D8A" text-anchor="start">Mijnheer de Voorzitter!</text><text x="480" y="472" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="500" fill="#555" text-anchor="start">Cremer replies on the budget.</text><rect x="80" y="730" width="720" height="200" rx="14" fill="#e4d8c4" stroke="#b7a48a"/><text x="90" y="760" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" fill="#1d1d1d" text-anchor="start">Press gallery  ·  observes, cannot speak</text><circle cx="160" cy="830" r="16" fill="#e8e0d2" stroke="#C4A35A" stroke-width="4"/><text x="186" y="836" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">journalist takes notes; leak is not in the Handelingen</text><rect x="830" y="90" width="450" height="420" rx="16" fill="#d3c4a8" stroke="#b7a48a"/><text x="1055" y="124" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="700" fill="#3a3328" text-anchor="middle">Wandelgang (off record)</text><circle cx="940" cy="260" r="16" fill="#e8e0d2" stroke="#2F5D8A" stroke-width="4"/><circle cx="1040" cy="300" r="16" fill="#e8e0d2" stroke="#2F5D8A" stroke-width="4"/><circle cx="1120" cy="250" r="16" fill="#e8e0d2" stroke="#C4A35A" stroke-width="4"/><line x1="956" y1="260" x2="1024" y2="300" stroke="#7B3FA0" stroke-width="3" stroke-dasharray="4 5"/><line x1="1056" y1="290" x2="1106" y2="258" stroke="#7B3FA0" stroke-width="3" stroke-dasharray="4 5"/><rect x="900" y="360" width="310" height="70" rx="8" fill="#f7f1e6" stroke="#7B3FA0"/><text x="915" y="388" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#7B3FA0" text-anchor="start">Leak hop 2: “the Minister of Colonies</text><text x="915" y="410" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#7B3FA0" text-anchor="start">may resign over a 5 million deficit.”</text><text x="855" y="470" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#5a5044" text-anchor="start">Corridor talk is never taken down by the stenographer.</text><rect x="830" y="530" width="215" height="400" rx="16" fill="#d9cbb3" stroke="#b7a48a"/><text x="938" y="564" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" fill="#3a3328" text-anchor="middle">Afdeeling A</text><text x="938" y="590" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#5a5044" text-anchor="middle">committee (off record)</text><rect x="1065" y="530" width="215" height="400" rx="16" fill="#d9cbb3" stroke="#b7a48a"/><text x="1172" y="564" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" fill="#3a3328" text-anchor="middle">Koloniën</text><text x="1172" y="590" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#5a5044" text-anchor="middle">ministers' rooms</text><circle cx="1172" cy="680" r="16" fill="#e8e0d2" stroke="#8B3A3A" stroke-width="4"/><text x="1172" y="720" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#8B3A3A" text-anchor="middle">unaware of leak</text><rect x="1330" y="20" width="470" height="940" rx="18" fill="#fbf8f2" stroke="#cbbfa6"/><text x="1354" y="56" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#7a705f" text-anchor="start">AGENT INSPECTOR</text><text x="1354" y="88" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#1d1d1d" text-anchor="start">van Asch van Wijck</text><text x="1354" y="114" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#5a5044" text-anchor="start">MP  ·  ARP  ·  Tweede Kamer</text><text x="1354" y="150" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#7a705f" text-anchor="start">ROLE AUTOMATON</text><text x="1354" y="172" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">MP  (Δ forbids MP → Journalist)</text><text x="1354" y="208" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#7a705f" text-anchor="start">LOCATION</text><text x="1354" y="230" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">Binnenhof ▸ Wandelgang ▸ Corridor</text><text x="1354" y="266" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#7a705f" text-anchor="start">AFFORDANCES HERE</text><text x="1354" y="288" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">talk, caucus, move, wait  —  not speak</text><text x="1354" y="324" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#7a705f" text-anchor="start">RETRIEVED MEMORY</text><text x="1354" y="346" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">Cremer told me the Minister may resign…</text><text x="1354" y="382" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#7a705f" text-anchor="start">PLAN</text><text x="1354" y="404" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">10:00 sit on right benches; request the floor</text><text x="1354" y="440" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#7a705f" text-anchor="start">LAST REFUSAL</text><text x="1354" y="462" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">Mijnheer de Voorzitter heeft u het woord nog niet gege</text><text x="1354" y="498" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#7a705f" text-anchor="start">RESEARCHER CONTROLS</text><rect x="1354" y="514" width="200" height="28" rx="6" fill="#14324a"/><text x="1454" y="533" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Interview</text><rect x="1354" y="550" width="200" height="28" rx="6" fill="#14324a"/><text x="1454" y="569" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Inner voice</text><rect x="1354" y="586" width="200" height="28" rx="6" fill="#14324a"/><text x="1454" y="605" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Edit object</text><rect x="1354" y="622" width="200" height="28" rx="6" fill="#14324a"/><text x="1454" y="641" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Inject event</text><rect x="1354" y="658" width="200" height="28" rx="6" fill="#14324a"/><text x="1454" y="677" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Read Handelingen</text><text x="1354" y="704" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#7a705f" text-anchor="start">LEGEND</text><circle cx="1364" cy="727" r="8" fill="none" stroke="#6B6B6B" stroke-width="3"/><text x="1380" y="732" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">Chair / clerk</text><circle cx="1364" cy="753" r="8" fill="none" stroke="#8B3A3A" stroke-width="3"/><text x="1380" y="758" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">Minister</text><circle cx="1364" cy="779" r="8" fill="none" stroke="#2F5D8A" stroke-width="3"/><text x="1380" y="784" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">Member (MP)</text><circle cx="1364" cy="805" r="8" fill="none" stroke="#C4A35A" stroke-width="3"/><text x="1380" y="810" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#1d1d1d" text-anchor="start">Journalist</text><text x="1354" y="930" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="500" fill="#7a705f" text-anchor="start">Composite Binnenhof; speech seeded from public Handelingen.</text></svg>